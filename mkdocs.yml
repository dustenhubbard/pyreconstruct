site_name: PyReconstruct
site_description: >-
  Annotation and 3D reconstruction for volume electron microscopy.
site_url: https://pyreconstruct.org/
repo_url: https://github.com/dustenhubbard/PyReconstruct
repo_name: dustenhubbard/PyReconstruct
edit_uri: edit/main/docs/
docs_dir: docs
# Class documents are public but unlisted: reached from docs/class/index.md,
# not from the nav.
not_in_nav: |
  /class/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/glass-stack-header.png
  favicon: assets/images/favicon.png
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.top
    - navigation.sections
    - navigation.tabs
    - search.suggest
    - content.code.copy
  # Follow the visitor's system theme. The toggle steps through system,
  # light and dark, and the browser remembers the choice.
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to system theme

plugins:
  - search

extra_css:
  - stylesheets/extra.css
  - stylesheets/class.css

extra_javascript:
  - javascripts/clips.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # GitHub-style heading slugs, so in-page anchors written for the GitHub
  # rendering of these files (e.g. #source--pip-installs) resolve here too.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - User Guide: USER_GUIDE.md
  - Performance: performance.md
  - The .jser file format: JSER_FORMAT.md
  - Developing with uv: DEV_UV.md
  - Release channels: RELEASE_CHANNELS.md
  - Contributing: https://github.com/dustenhubbard/PyReconstruct/blob/main/CONTRIBUTING.md
  - Security: https://github.com/dustenhubbard/PyReconstruct/blob/main/SECURITY.md
