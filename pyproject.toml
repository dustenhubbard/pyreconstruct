[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyreconstruct"
dynamic = ["version"]
description = "RECONSTRUCT in Python"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Julian Falco" },
    { name = "Michael Chirillo", email = "m.chirillo@utexas.edu" },
]

# Runtime dependencies (mirrors the former requirements.txt).
# opencv-python -> opencv-python-headless: the app uses cv2 only for image
# processing (no imshow/GUI), and the headless build ships no Qt plugins, which
# avoids a plugin clash with PySide6 in frozen builds.
dependencies = [
    "PySide6==6.5.2",
    "vtk==9.5.2",
    "vedo==2025.5.4",
    "opencv-python-headless==4.8.1.78",
    "numpy==1.24.1",
    "scipy==1.14.1",
    "scikit-image==0.23.2",
    "shapely==2.1.1",
    "trimesh==3.18.1",
    "zarr==2.18.2",
    "numcodecs==0.15.0",
    "cloud-volume==11.0.0",
    "lxml==6.1.0",
    "tifffile==2024.9.20",
    "qdarkstyle==3.2.3",
    "gitpython==3.1.57",
    "orjson==3.11.8",   # fast JSON on the hot jser load/save paths (stdlib fallback)
    "certifi",   # CA bundle for TLS verification in the frozen app (updater)
    "packaging",
    # SVG/PNG section export (`modules/backend/exports/svg_conversion.py`, reached
    # from File > Export > SVG/PNG). Both were imported by that module from the day
    # it landed but were never declared anywhere, so `Section.exportAsSVG` raised
    # ModuleNotFoundError in every correctly-installed environment.
    "svgwrite==1.4.3",
    # cairosvg is a *partial* fix on its own: it reaches native Cairo through
    # cairocffi's runtime dlopen, so the wheel installs everywhere but `import
    # cairosvg` still raises OSError("no library called \"cairo-2\" was found") on
    # a machine with no libcairo on the loader path. pip/uv cannot supply that --
    # it is `apt-get install libcairo2` / `brew install cairo` (plus, on macOS,
    # Homebrew's /opt/homebrew/lib being reachable, since ctypes.util.find_library
    # does not search it). SVG export needs only svgwrite and is unaffected; PNG
    # export is the path with the system-level requirement. See
    # tests/test_export_svg_png.py, which asserts the declaration unconditionally
    # and skips only the native render.
    "cairosvg==2.9.0",
    # Same module, same class of gap, and the one the guard does *not* cover.
    # `export_svg` does `from PIL import Image` to embed the section image as a
    # base64 PNG, so pillow is a first-party runtime requirement of SVG (and
    # therefore PNG) export -- but `exportSectionSVG`'s `modules_available`
    # guard probes only svgwrite, so an absent pillow raises ModuleNotFoundError
    # straight out of `export_svg` and lands in customExcepthook as a crash
    # report rather than the guard's pip-install offer.
    #
    # Nothing fails today only because pillow arrives transitively, and every
    # one of those edges belongs to somebody else: cairosvg and scikit-image
    # (direct), imageio (via scikit-image), matplotlib (via vtk), neuroglancer
    # (dev group only, so not present in a runtime install at all). A bump of
    # scikit-image or vtk, or dropping cairosvg, silently removes one of them.
    # Declaring it costs nothing -- 12.3.0 is the version already resolved, and
    # pillow ships binary wheels on every supported platform with no native
    # prerequisite of its own -- and it is what makes the import a promise.
    "pillow==12.3.0",
]

[project.urls]
Homepage = "https://github.com/SynapseWeb/PyReconstruct"

[project.scripts]
PyReconstruct = "PyReconstruct.cli:main"

# Test-only deps, installable with `pip install -e ".[test]"`. Kept separate from
# the uv-managed [dependency-groups].dev below so CI can install just the suite's
# needs (pytest) on top of the runtime deps, without the heavy dev extras. pytest
# is held to the 9.x line the suite is verified against (8.x is untested; 10 drops
# a config shim deprecated in 9.1).
#
# pytest-qt supplies the `qtbot`/`qapp` fixtures the real-widget tests need: one
# QApplication for the whole session (constructing a second one aborts) and
# deterministic teardown of the widgets a test builds. PySide6 is already a
# runtime dependency, so this adds no Qt of its own. It belongs in this extra,
# not in [dependency-groups].dev, because CI installs the suite with
# `--extra test --no-default-groups` and would otherwise not see it.
[project.optional-dependencies]
test = [
    "pytest>=9,<10",
    "pytest-qt>=4",
]

# Developer-only tooling (PEP 735). Installed by `uv sync`, not shipped to
# end users. Replaces the conda-only extras from dev/environment_dev.yaml.
[dependency-groups]
dev = [
    "psycopg2-binary",
    "funlib.show.neuroglancer",
]

[tool.uv.sources]
"funlib.show.neuroglancer" = { git = "https://github.com/funkelab/funlib.show.neuroglancer" }

# Retired asset directories are no longer subtracted here. They live outside the
# package, in `dev/assets/`, which is exclusion by construction: `packages.find`
# only looks inside `PyReconstruct*`, and every `package-data` glob resolves
# relative to a package directory. That closes all three of the mechanisms that
# previously each needed their own explicit exclusion:
#
#   1. `namespaces` defaults to true for `packages.find`, so every directory
#      under a package root is discovered as a namespace package and its `.py`
#      files are built as modules. `dev/` is not under a package root.
#   2. The `assets/**/*` glob in `[tool.setuptools.package-data]` sweeps the
#      tree as data of the `PyReconstruct` package, resolved relative to
#      `PyReconstruct/`, which `dev/` is not inside.
#   3. `include-package-data` also defaults to true, and `setuptools-scm`
#      contributes every tracked file to the manifest, but a manifest file only
#      ships when it can be attributed to a package. `dev/` has no enclosing
#      package, so there is nothing to attribute it to.
#
# Moved out rather than excluded (decided 2026-08-06): an exclusion has to be
# kept correct against every mechanism that might reach the files, and a fourth
# mechanism would need a fourth entry. A directory outside the package root
# cannot be reached by a mechanism that only ever looks inside it.
#
#   dev/assets/misc/          Standalone convert-a-zarr scripts, plus the two
#                             `tif_to_zarr` launchers, which still `cd` to
#                             `src/assets/misc/` -- a path that stopped existing
#                             in 2023 when the tree was reorganized for pip.
#                             Each runs `input()` or hand-edited constants at
#                             module level, so none can even be imported. The
#                             in-app converters and "Import labels" supersede
#                             them.
#   dev/assets/scripts/img/   `mask.py` imports `colorama`, deliberately not a
#                             runtime dependency.
#   dev/assets/scripts/contours_from_labels/
#                             Reached only by `dev/scripts/ng-make-contours`.
#   dev/assets/checker/       ~1.8 MB of fixtures for the source test suite. The
#                             installers already skipped these; the wheel
#                             shipped them until the move.
#
# Still inside the package, and deliberately so: `assets/scripts/projects`
# (imported by `modules/gui/main/main_imports.py`), `assets/scripts/convert_zarr`
# and `assets/scripts/create_ng_zarr` (both launched by `start_process.py`), and
# `start_process.py` itself. `projects/grids.py` and `create_ng_zarr/ng_view.py`
# are dev-only but live inside directories the app imports from, and a per-file
# carve-out there buys two files at the cost of a fragile pattern.
#
# The moved files stay in the repository, stay linted, and keep working from a
# checkout through the wrappers in `dev/scripts/` that `dev/link_shell.sh` puts
# on `PATH`. This removes them from the distribution, not from the project.
[tool.setuptools.packages.find]
include = ["PyReconstruct*"]

# The include glob is left broad so a newly added asset ships by default.
# `packaging/PyReconstruct.spec` bundles the same tree, so the installers and
# the wheel ship the same code.
[tool.setuptools.package-data]
PyReconstruct = ["assets/**/*", "assets/welcome_series/.welcome/*"]

[tool.setuptools_scm]
# Tag-derived version. Writes PyReconstruct/_version.py at build time so the
# frozen app can read its version without git or installed package metadata.
version_file = "PyReconstruct/_version.py"
fallback_version = "0.0.0+unknown"
