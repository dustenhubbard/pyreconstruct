[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyreconstruct"
dynamic = ["version"]
description = "RECONSTRUCT in Python"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Julian Falco" },
    { name = "Michael Chirillo", email = "m.chirillo@utexas.edu" },
]

# Runtime dependencies (mirrors the former requirements.txt).
# opencv-python -> opencv-python-headless: the app uses cv2 only for image
# processing (no imshow/GUI), and the headless build ships no Qt plugins, which
# avoids a plugin clash with PySide6 in frozen builds.
dependencies = [
    "PySide6==6.5.2",
    "vtk==9.5.2",
    "vedo==2025.5.4",
    "opencv-python-headless==4.8.1.78",
    "numpy==1.24.1",
    "scipy==1.14.1",
    "scikit-image==0.23.2",
    "shapely==2.1.1",
    "trimesh==3.18.1",
    "zarr==2.18.2",
    "numcodecs==0.15.0",
    "cloud-volume==11.0.0",
    "lxml==6.1.0",
    "tifffile==2024.9.20",
    "qdarkstyle==3.2.3",
    "gitpython==3.1.57",
    "orjson==3.11.8",   # fast JSON on the hot jser load/save paths (stdlib fallback)
    "certifi",   # CA bundle for TLS verification in the frozen app (updater)
    "packaging",
]

[project.urls]
Homepage = "https://github.com/SynapseWeb/PyReconstruct"

[project.scripts]
PyReconstruct = "PyReconstruct.cli:main"

# Test-only deps, installable with `pip install -e ".[test]"`. Kept separate from
# the uv-managed [dependency-groups].dev below so CI can install just the suite's
# needs (pytest) on top of the runtime deps, without the heavy dev extras. pytest
# is held to the 9.x line the suite is verified against (8.x is untested; 10 drops
# a config shim deprecated in 9.1).
#
# pytest-qt supplies the `qtbot`/`qapp` fixtures the real-widget tests need: one
# QApplication for the whole session (constructing a second one aborts) and
# deterministic teardown of the widgets a test builds. PySide6 is already a
# runtime dependency, so this adds no Qt of its own. It belongs in this extra,
# not in [dependency-groups].dev, because CI installs the suite with
# `--extra test --no-default-groups` and would otherwise not see it.
[project.optional-dependencies]
test = [
    "pytest>=9,<10",
    "pytest-qt>=4",
]

# Developer-only tooling (PEP 735). Installed by `uv sync`, not shipped to
# end users. Replaces the conda-only extras from dev/environment_dev.yaml.
[dependency-groups]
dev = [
    "psycopg2-binary",
    "funlib.show.neuroglancer",
]

[tool.uv.sources]
"funlib.show.neuroglancer" = { git = "https://github.com/funkelab/funlib.show.neuroglancer" }

# Retiring a bundled directory takes an entry in all three of the tables below.
# Verified by building a wheel with each combination; anything less ships the
# files anyway, because three separate mechanisms each reach them:
#
#   1. `namespaces` defaults to true for `packages.find` in `pyproject.toml`, so
#      every directory under `assets/` is discovered as a namespace package and
#      its `.py` files are built as modules. The `exclude` below stops that.
#   2. The `assets/**/*` glob in `[tool.setuptools.package-data]` sweeps the
#      whole tree as data of the `PyReconstruct` package. The `PyReconstruct`
#      key of `exclude-package-data` filters that pass.
#   3. `include-package-data` also defaults to true, and `setuptools-scm`
#      contributes every tracked file to the manifest. Manifest files are
#      attributed to the nearest enclosing package, which for a directory
#      removed in step 1 is its parent, and each package's data is filtered only
#      by its own `exclude-package-data` key. Hence the `PyReconstruct.assets`
#      and `PyReconstruct.assets.scripts` keys.
#
# Excluded below: bundled script directories with no runtime consumer. Nothing
# in the app imports or launches them and nothing in docs/ tells a user to run
# them. They are developer tools, run from a source checkout through the
# wrappers in `dev/scripts/` that `dev/link_shell.sh` puts on `PATH`, so the
# copy inside an installed package was never reachable by any documented route.
#
#   assets/misc/           Standalone convert-a-zarr scripts, plus the two
#                          `tif_to_zarr` launchers, which still `cd` to
#                          `src/assets/misc/` -- a path that stopped existing in
#                          2023 when the tree was reorganized for pip. Each
#                          script runs `input()` or hand-edited constants at
#                          module level, so none can even be imported. The
#                          in-app converters and "Import labels" supersede them.
#   assets/scripts/img/    `mask.py` imports `colorama`, deliberately not a
#                          runtime dependency, so the shipped copy cannot run at
#                          all in an end-user install.
#   assets/scripts/contours_from_labels/
#                          Reached only by `dev/scripts/ng-make-contours`.
#
# Not excluded, and deliberately so: `assets/scripts/projects` (imported by
# `modules/gui/main/main_imports.py`), `assets/scripts/convert_zarr` and
# `assets/scripts/create_ng_zarr` (both launched by `start_process.py`), and
# `start_process.py` itself. `projects/grids.py` and `create_ng_zarr/ng_view.py`
# are dev-only but live inside directories the app imports from, and a per-file
# carve-out there buys two files at the cost of a fragile pattern.
#
# The excluded files stay in the repository, stay linted, and keep working from
# a checkout. This removes them from the distribution, not from the project.
[tool.setuptools.packages.find]
include = ["PyReconstruct*"]
exclude = [
    "PyReconstruct.assets.misc",
    "PyReconstruct.assets.scripts.img",
    "PyReconstruct.assets.scripts.contours_from_labels",
]

# The include glob is left broad so a newly added asset ships by default; the
# retired directories are subtracted rather than the glob being replaced with an
# explicit list, which is how assets get dropped by omission.
# `packaging/PyReconstruct.spec` skips the same paths so the installers and the
# wheel ship the same code.
[tool.setuptools.package-data]
PyReconstruct = ["assets/**/*", "assets/welcome_series/.welcome/*"]

[tool.setuptools.exclude-package-data]
PyReconstruct = [
    "assets/misc/*",
    "assets/scripts/img/*",
    "assets/scripts/contours_from_labels/*",
]
"PyReconstruct.assets" = [
    "misc/*",
    "scripts/img/*",
    "scripts/contours_from_labels/*",
]
"PyReconstruct.assets.scripts" = [
    "img/*",
    "contours_from_labels/*",
]

[tool.setuptools_scm]
# Tag-derived version. Writes PyReconstruct/_version.py at build time so the
# frozen app can read its version without git or installed package metadata.
version_file = "PyReconstruct/_version.py"
fallback_version = "0.0.0+unknown"
