# mypy configuration for PyReconstruct.
#
# Standalone file rather than a `[tool.mypy]` block in pyproject.toml, matching
# the existing ruff.toml / pytest.ini pattern: tool config stays independent of
# the packaging metadata and can be read and changed on its own.
#
# REPORTING ONLY. The CI job that runs this (`type` in .github/workflows/test.yml)
# ends in an explicit `exit 0` and cannot fail the build; `make type` prefixes
# the command with `-` for the same reason. Nothing here is a merge gate. A type
# checker that goes red on a pull request that did not cause the error gets
# switched off, which is worse than not having one, so it reports first and earns
# a gate later.
#
#
# WHY THIS SCOPE
#
# `--strict` over the whole package was measured and rejected: 5,416 errors in
# 141 of 173 files, 55% of it `no-untyped-def` plus `no-untyped-call`. The
# latter is contagious -- annotating one function turns its call sites into
# errors until their callers are annotated too -- so there is no incremental path
# through a global gate. You get 5,416 errors or an exclusion list so long it is
# not a gate.
#
# The three packages below are the Qt-free core: the data model, the geometry
# and the constants. Measured with an AST pass over module-scope imports across
# all 190 modules in the package, they are the packages with no PySide6 import
# at module scope, directly or transitively. `modules/backend` is NOT in scope
# and cannot be: 22 of its 48 modules reach Qt (view/, threading/, table/,
# autoseg/, imports/, volume/, func/xml_json_conversions). `modules/gui` is Qt by
# definition.
#
# Scope matters because PySide6 ships real stubs. Pulling Qt in makes every
# signal connection, widget override and painter call newly checkable, and each
# newly checked site is a new error. Keeping the scope Qt-free is what keeps the
# number readable.
#
# `modules/datatypes_legacy` is also Qt-free and measured at +2 errors. It is the
# obvious next package to add; left out here only so the initial scope matches
# the three packages the design named.
#
#
# MEASURED BASELINE, at the pinned mypy version (mypy==2.3.0, pinned in the
# Makefile and in the `type` CI job), in the environment both of them build
# (`uv sync --frozen --no-default-groups --extra test`), on the commit that
# added this file:
#
#   Found 218 errors in 17 files (checked 35 source files)
#
#   assignment 92 (40 of them implicit-Optional defaults), arg-type 69,
#   var-annotated 19, return-value 10, misc 8, attr-defined 7, everything
#   else 13. Half the total (114) is in datatypes/series.py alone.
#
# The number moves a little with what is installed, because installed packages
# supply the stubs mypy reads: the same run against a fuller developer
# environment (the git-built `dev` group present) reports 223, and against no
# project environment at all, 216. Reproduce the baseline through `make type`,
# not with an ambient mypy.
#
# That is a 25x reduction from the global-strict number and it fits on a screen.
# Do not treat a change in it as a regression signal until the count has been
# watched over a few pull requests; that is what the reporting phase is for.
#
[mypy]
python_version = 3.11

files =
    PyReconstruct/modules/datatypes,
    PyReconstruct/modules/calc,
    PyReconstruct/modules/constants

# The core imports names from `modules/backend` and `modules/gui`, which are
# full of Qt. `silent` still type-checks those modules for inference (so calls
# into them are checked properly) but does not *report* their errors. Without
# it the run reports 380 errors, most of them in files outside the scope this
# config claims to cover -- which is exactly the "goes red on an unrelated pull
# request" failure mode.
follow_imports = silent

# vtk, vedo, cloud-volume, funlib and several others ship no type information.
# This silences the "library stubs not installed" noise for them.
#
# Deliberately NOT paired with `follow_imports = skip` for those libraries.
# `skip` makes them `Any` outright and discards type information that does
# exist -- shapely and numpy both ship inline types, and geometry correctness is
# precisely where the checking is worth having.
ignore_missing_imports = True

# Non-strict, stated explicitly rather than left to the defaults so that a
# future `--strict` cannot arrive by accident. Each of these is a ratchet to
# turn on per-module via an `[mypy-PyReconstruct.modules.<pkg>.*]` override once
# that module is annotated, which is the incremental path the global gate does
# not have.
strict = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
check_untyped_defs = False
warn_return_any = False
no_implicit_reexport = False

# Housekeeping: flag a stale section in this file, and show the error code on
# every line so the counts above stay reproducible.
warn_unused_configs = True
show_error_codes = True
