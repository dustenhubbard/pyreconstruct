name: tests

# The PR gate: a ruff lint pass and the pytest suite. Fires on every PR targeting
# main and on pushes to main itself (the post-merge validation). The tests import
# PySide6 (gui.main), so the job installs the headless Qt system libs and runs
# under the offscreen QPA platform — no X server / xvfb needed.
#
# The two jobs run in parallel rather than lint-then-test: lint finishes in well
# under a minute, so gating the suite behind it would delay the slower signal
# without saving anything worth the wall-clock.
#
# Actions are pinned to full commit SHAs (the human-readable version rides in a
# trailing comment). Floating major tags are mutable — whoever controls the tag
# controls what runs in this workflow — and setup-uv stopped publishing
# major/minor tags at v8.0.0 for exactly that reason, so @v7 was a frozen dead
# end anyway. SHA pins do not self-update: bumping an action now means resolving
# the new tag's commit SHA and updating both the pin and the comment (renovate/
# dependabot automate this; adopting one is a separate decision). The release
# pipeline is deliberately not converted yet — this workflow only.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per ref; a newer push to the same PR/branch supersedes the old.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only checks out and builds; it touches no secrets.
permissions:
  contents: read

jobs:
  # Blocking lint on the critical-error set configured in ruff.toml: syntax
  # errors and undefined names only (E9/F63/F7/F82). The tree passes this clean
  # as of this commit, so the gate costs no code changes and starts catching
  # regressions immediately. It is deliberately not the full ruff default set —
  # see the rationale in ruff.toml.
  #
  # No Python setup step: `uvx` fetches a standalone ruff binary, so this job
  # needs neither an interpreter nor the project's dependencies and finishes in
  # seconds. The version is pinned to match the Makefile's `make lint`.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Ruff (critical-error set)
        run: uvx ruff@0.15.20 check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # headroom for the cold wheel install (vtk/scipy/...); the suite itself is ~seconds
    steps:
      # Still a shallow clone: no test reads the setuptools-scm version. Tags
      # are the one exception and they are cheap to add on their own.
      # tests/test_notes_headings_have_tags.py compares every `## [x.y.z]`
      # heading in WHATS_NEW.md and CHANGELOG.md against the tag list, and
      # without this it would see an empty list and pass for the wrong reason.
      # It fails loudly rather than skipping if the list ever comes back empty.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-tags: true

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true        # cache uv's download/build cache across runs
          cache-dependency-glob: uv.lock

      - name: Install headless Qt system libs
        # PySide6 6.5 needs these even under the offscreen platform. libglib2.0-0t64,
        # libX11, libfreetype6 and zlib are already present on the ubuntu-latest image.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install project + test deps (frozen against uv.lock)
        # --frozen: use the committed lock exactly, fail if it drifted from pyproject.toml.
        # uv provisions Python 3.11 itself from requires-python; --no-default-groups skips
        # the git-built `dev` group (funlib) the suite does not need; --extra test adds pytest.
        run: uv sync --frozen --no-default-groups --extra test

      - name: Widget tests are present (fail if the gui marker collects nothing)
        # The failure this catches is a green run with the widget tests silently
        # absent. pytest-qt is in the `test` extra, so an environment without it
        # has no `qapp` fixture; tests/conftest.py now raises on that, but this
        # step covers the other direction, where the gui tests are still
        # collectable and simply are not there any more: a rename that drops the
        # mark, a deleted module, a deselecting flag added to addopts. In all of
        # those the suite goes green with fewer tests and nothing says so.
        #
        # Counting: `--collect-only -q` prints one `path: N` line per file and no
        # grand total, so the count is summed here. Costs ~3s of collection.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          count=$(uv run --frozen --no-default-groups --extra test \
                    python -m pytest --collect-only -q -m gui \
                  | awk -F': ' '/^tests\// {sum += $2} END {print sum + 0}')
          echo "gui-marked tests collected: $count"
          if [ "$count" -eq 0 ]; then
            echo '::error::the gui marker collected 0 tests. The real-widget suite is not running.'
            exit 1
          fi

      - name: Run test suite (headless / offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen --no-default-groups --extra test python -m pytest -ra   # -ra surfaces xfail/xpass/skip reasons if the gate goes red
