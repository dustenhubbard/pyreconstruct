name: tests

# The PR gate: a ruff lint pass and the pytest suite, plus one job that reports
# and does not gate. Fires on every pull request whatever it targets, and on
# pushes to main itself (the post-merge validation). The tests import PySide6
# (gui.main), so the job installs the headless Qt system libs and runs under the
# offscreen QPA platform, with no X server / xvfb needed.
#
# Two of the three jobs block a merge: `lint` and `test`. `type` is reporting
# only by design and cannot fail the build -- see its own comment for why, and
# `mypy.ini` for what it covers. Do not promote it to a gate without watching
# its count over a run of pull requests first.
#
# The jobs run in parallel rather than lint-then-test: lint finishes in well
# under a minute, so gating the suite behind it would delay the slower signal
# without saving anything worth the wall-clock.
#
# Actions are pinned to full commit SHAs (the human-readable version rides in a
# trailing comment). Floating major tags are mutable — whoever controls the tag
# controls what runs in this workflow — and setup-uv stopped publishing
# major/minor tags at v8.0.0 for exactly that reason, so @v7 was a frozen dead
# end anyway. SHA pins do not self-update: bumping an action now means resolving
# the new tag's commit SHA and updating both the pin and the comment (renovate/
# dependabot automate this; adopting one is a separate decision). The release
# pipeline is deliberately not converted yet — this workflow only.
#
# No `branches:` filter on `pull_request`, deliberately, and this is the same
# reasoning notes-checks.yml already records. The filter used to read
# `branches: [main]`, which meant a pull request opened against any other branch
# ran nothing at all: no lint, no suite, and a green-looking merge box with no
# checks behind it. #174 merged that way, stacked on
# `feat/update-check-on-by-default`, with a rollup of zero checks. Stacking is
# banned now, which shrinks the exposure, but a trigger that silently runs
# nothing is worth closing on its own: a release branch, a long-lived feature
# branch or a documentation branch all take pull requests too, and none of them
# announce that the gate is off.
#
# The cost is that a pull request between any two branches now runs the suite.
# That is acceptable here: the suite itself is seconds, the wall-clock is the
# cold dependency install and setup-uv caches it, and `concurrency` below already
# cancels a superseded run per ref. The population it adds is small in any case,
# because a pull request that does not target main is now the exception.
#
# `push` keeps `branches: [main]` on purpose. That trigger is post-merge
# validation, and removing its filter would run the whole suite on every push to
# every branch in the repository, most of which are work in progress and many of
# which already have an open pull request running the same jobs.
on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; a newer push to the same PR/branch supersedes the old.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only checks out and builds; it touches no secrets.
permissions:
  contents: read

jobs:
  # Blocking lint on the critical-error set configured in ruff.toml: syntax
  # errors and undefined names only (E9/F63/F7/F82). The tree passes this clean
  # as of this commit, so the gate costs no code changes and starts catching
  # regressions immediately. It is deliberately not the full ruff default set —
  # see the rationale in ruff.toml.
  #
  # No Python setup step: `uvx` fetches a standalone ruff binary, so this job
  # needs neither an interpreter nor the project's dependencies and finishes in
  # seconds. The version is pinned to match the Makefile's `make lint`.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Ruff (critical-error set)
        run: uvx ruff@0.15.20 check .

  # REPORTING ONLY. This job cannot fail the build and is not a merge gate: the
  # mypy step ends in an explicit `exit 0` and the count is written to the run
  # summary instead. That is the whole design. A type checker that turns a pull request
  # red for an error the pull request did not introduce gets ignored, then
  # switched off, which leaves the repository worse off than having no checker.
  # It earns a gate by being watched for a while first.
  #
  # Scope, strictness and the measured baseline all live in `mypy.ini` -- read
  # that file, not this job, for what is being checked and why. Summary: the
  # Qt-free core only (modules/datatypes, modules/calc, modules/constants),
  # non-strict, 218 errors in 17 of 35 files at the pinned version. Whole-tree
  # `--strict` was measured at 5,416 errors in 141 files and rejected.
  #
  # Unlike the lint job above this one does need the project installed, and the
  # divergence is deliberate rather than an oversight: ruff's findings depend
  # only on the source, while mypy's depend on which packages are importable,
  # because installed packages supply the stubs. Running it bare would check the
  # core against `Any` for numpy and shapely, which is where the geometry
  # correctness lives. The install is the same `uv sync` line the test job runs,
  # so setup-uv's cache is shared between them and this costs seconds warm.
  #
  # No headless Qt system libs step, unlike the test job: mypy reads PySide6's
  # stubs and never imports it, so nothing here loads a Qt plugin.
  type:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project (frozen against uv.lock)
        # Same flags as the Makefile's UV variable, so `make type` and this job
        # resolve the same environment and cannot report different counts.
        run: uv sync --frozen --no-default-groups --extra test

      - name: mypy (Qt-free core, non-strict, reporting only)
        # mypy is pinned: an unpinned type checker changes its findings under
        # you and the baseline in mypy.ini stops meaning anything. `--with`
        # keeps it out of pyproject.toml and uv.lock entirely.
        #
        # No paths and no flags: mypy.ini owns the scope. Passing paths here
        # would override its `files` and quietly widen or narrow what runs.
        #
        # mypy's own exit code is kept and reported rather than swallowed. 0 is
        # a clean tree, 1 is "errors found" and is the normal case here, and 2
        # or above is mypy itself failing (a config error, a crash, an internal
        # error). Without that distinction a crash produces an empty report and
        # a summary reading "0 errors", which is the most misleading thing a
        # reporting-only job can say. It still does not fail the build.
        #
        # One exit code below that threshold is not mypy's at all. `status` is
        # the exit of the whole `uv run` wrapper, and uv exits 1 when it cannot
        # build the environment: a yanked or withdrawn `mypy==2.3.0`, mypy
        # missing from it, a resolution refused with the network disabled. That
        # text carries no `: error:` line, so `errors` comes back 0 and exit 1
        # on its own is indistinguishable from the normal case. The two are
        # separable anyway, because mypy exits 1 only when it found errors and
        # every one of those prints a `: error:` line even under
        # `--no-error-summary`: `status` 1 with `errors` 0 is self-contradictory
        # for a real run and can only mean the wrapper never reached mypy. The
        # condition below reads it as a non-run. It is worth guarding because
        # the pin is genuinely re-resolved every time: it lives only in the
        # `--with` string and in the Makefile, never in `uv.lock`, so `--frozen`
        # does not cover it and it sits outside setup-uv's `uv.lock` cache key.
        # (An unreachable index exits 2 and was already caught.)
        run: |
          # `set +e` on purpose. Actions runs `run:` under `bash -eo pipefail`,
          # so without this the step would abort the instant mypy exits 1, which
          # is its normal exit here, and never reach the summary.
          set -u +e
          uv run --frozen --no-default-groups --extra test --with mypy==2.3.0 \
            python -m mypy --no-color-output --no-error-summary \
            > mypy-report.txt 2>&1
          status=$?
          errors=$(grep -c ': error:' mypy-report.txt || true)
          files=$(grep ': error:' mypy-report.txt | cut -d: -f1 | sort -u | wc -l | tr -d ' ')
          if [ "$status" -ge 2 ] || { [ "$status" -eq 1 ] && [ "$errors" -eq 0 ]; }; then
            headline="mypy did not run to completion (exit ${status}, ${errors} errors parsed). The counts below mean nothing."
          else
            headline="**${errors} errors in ${files} files.** Baseline when this job landed: 218 in 17."
          fi
          {
            echo "## mypy: Qt-free core (reporting only)"
            echo
            echo "$headline"
            echo
            echo 'Not a gate. See `mypy.ini` for the scope and why `--strict` over the whole tree was rejected.'
            echo
            echo '<details><summary>Full report</summary>'
            echo
            echo '```'
            cat mypy-report.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          cat mypy-report.txt
          exit 0   # reporting only: this job never fails the build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # headroom for the cold wheel install (vtk/scipy/...); the suite itself is ~seconds
    steps:
      # Still a shallow clone: no test reads the setuptools-scm version. Tags
      # are the one exception and they are cheap to add on their own.
      # tests/test_notes_headings_have_tags.py compares every `## [x.y.z]`
      # heading in WHATS_NEW.md and CHANGELOG.md against the tag list, and
      # without this it would see an empty list and pass for the wrong reason.
      # It fails loudly rather than skipping if the list ever comes back empty.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-tags: true

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true        # cache uv's download/build cache across runs
          cache-dependency-glob: uv.lock

      - name: Install headless Qt system libs
        # PySide6 6.5 needs these even under the offscreen platform. libglib2.0-0t64,
        # libX11, libfreetype6 and zlib are already present on the ubuntu-latest image.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install project + test deps (frozen against uv.lock)
        # --frozen: use the committed lock exactly, fail if it drifted from pyproject.toml.
        # uv provisions Python 3.11 itself from requires-python; --no-default-groups skips
        # the git-built `dev` group (funlib) the suite does not need; --extra test adds pytest.
        run: uv sync --frozen --no-default-groups --extra test

      - name: Widget tests are present (fail if the gui marker collects nothing)
        # The failure this catches is a green run with the widget tests silently
        # absent. pytest-qt is in the `test` extra, so an environment without it
        # has no `qapp` fixture; tests/conftest.py now raises on that, but this
        # step covers the other direction, where the gui tests are still
        # collectable and simply are not there any more: a rename that drops the
        # mark, a deleted module, a deselecting flag added to addopts. In all of
        # those the suite goes green with fewer tests and nothing says so.
        #
        # Counting: `--collect-only -q` prints one `path: N` line per file and no
        # grand total, so the count is summed here. Costs ~3s of collection.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          count=$(uv run --frozen --no-default-groups --extra test \
                    python -m pytest --collect-only -q -m gui \
                  | awk -F': ' '/^tests\// {sum += $2} END {print sum + 0}')
          echo "gui-marked tests collected: $count"
          if [ "$count" -eq 0 ]; then
            echo '::error::the gui marker collected 0 tests. The real-widget suite is not running.'
            exit 1
          fi

      - name: Run test suite (headless / offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen --no-default-groups --extra test python -m pytest -ra   # -ra surfaces xfail/xpass/skip reasons if the gate goes red
