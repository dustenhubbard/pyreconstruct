name: build-installers

# Builds one-click installers and publishes them to THIS repo's GitHub
# Releases for a cut release. Two channels:
#
#   * stable:  a clean vX.Y.Z tag on main -> a GitHub Release, the latest one,
#              with the WHATS_NEW.md body for that version.
#   * nightly: a vX.Y.Z.devYYYYMMDD tag, cut by nightly.yml from main when main
#              has new commits -> a GitHub pre-release, never marked latest,
#              with GitHub's auto-generated notes against the previous nightly
#              (or the newest stable, when no nightly exists yet).
#
# Any other tag shape that reaches here (vX.Y.ZrcN, vX.Y.ZaN, a dashed
# pre-release) publishes as a pre-release with the WHATS_NEW body, as before.
# The in-app updater (updater.GITHUB_REPO) reads these. Runs on the fork as-is
# (no hardcoded owner). The macOS app and dmg are signed with a Developer ID and
# notarized when the signing secrets exist, which is only on a v* tag (see the
# build job's `environment`); the Windows installer is unsigned.
#
# Installers are built ONLY for a tag (or a manual workflow_dispatch), NOT on
# every push to main. The former rolling "latest main" build that republished a
# 'prerelease' release on each push -- and the in-app Developer channel it fed --
# has been removed: it caused a field regression (old clients predating the
# pre-release channel's ROLLING_TAG exclusion were offered dev builds when the
# rolling build recreated its release out of order). The nightly train replaces
# it with one dated, immutable tag a day, built through this same path. The
# pytest suite still runs on every main push via the separate `tests` workflow
# (.github/workflows/test.yml).
#
# Flavor: main carries packaging/FLAVOR = dev, so a build is the Dev app unless
# the "Pick the build flavor" step removes that file. It does so for a clean
# vX.Y.Z tag (stable by promotion, no release branch) and for a manual run
# with flavor=stable (a stable dry run from any branch). A nightly tag is not
# a clean vX.Y.Z, so it keeps the file and builds PyReconstruct Dev.
#
# A workflow_dispatch may run on a tag ref (nightly.yml does exactly that,
# because a tag pushed with GITHUB_TOKEN never fires the `push: tags:` trigger
# below). Every step here reads GITHUB_REF_NAME, which is the tag name in both
# cases, so a dispatched tag build is the same build a hand-pushed tag gets.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor. stable removes packaging/FLAVOR, as a vX.Y.Z tag does."
        type: choice
        options: [dev, stable]
        default: dev

permissions:
  contents: write   # create / update GitHub Releases

jobs:
  build:
    concurrency:
      # Cancel a superseded in-flight build; ref-scoped so tags keep separate
      # lanes. The group MUST also include the matrix leg: job-level concurrency
      # applies per job instance, so without the matrix key all three legs of
      # ONE run share a group and cancel each other (this broke every build
      # after it was first introduced ref-only -- two legs cancelled, release
      # skipped). Per-leg groups keep the intended behavior: a re-pushed tag
      # cancels the older run's same-platform leg only.
      group: build-installers-build-${{ github.ref }}-${{ matrix.plat }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, plat: Windows, arch: x86_64 }
          # Two native single-arch macOS builds rather than one universal2 build:
          # the native dependency stack (vtk 9.4.2, scipy, scikit-image, opencv,
          # the cloud-volume codecs) ships per-arch wheels, not universal2, so a
          # universal2 freeze would force source builds and likely fail. Each arch
          # is built on its own native runner, where PyInstaller freezes for the
          # arch of the runner's Python.
          #   macos-14 = Apple Silicon (arm64); macos-15-intel = Intel (x86_64).
          # GitHub retired the macos-13 Intel image in Dec 2025; macos-15-intel is
          # the current Intel label, available until macOS 15 retires (~Fall 2027),
          # after which GitHub drops x86_64 macOS runners entirely. The Intel dmg is
          # purely additive: if that leg is unavailable or fails, fail-fast:false
          # plus the release jobs' failure-tolerant gate still ship the arm64 and
          # Windows installers.
          - { os: macos-14,       plat: macOS,   arch: arm64 }
          - { os: macos-15-intel, plat: macOS,   arch: x86_64 }
    runs-on: ${{ matrix.os }}
    # The signing secrets live in the `release` environment, which accepts only
    # v* tags (stable tags and the nightly's vX.Y.Z.devYYYYMMDD). Any other ref,
    # such as a manual dispatch on a branch, runs with no environment, gets no
    # signing secrets, and builds the unsigned app.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # setuptools-scm needs full history + tags

      - name: Pick the build flavor
        # Runs before anything reads packaging/FLAVOR. A clean vX.Y.Z tag, or a
        # manual run with flavor=stable, builds the stable app by removing the
        # file. skip-worktree comes first because a plain delete leaves the tree
        # dirty, and setuptools-scm then stamps the version with a dirty-tree
        # date suffix, which the tag check below refuses.
        shell: bash
        env:
          FLAVOR_INPUT: ${{ inputs.flavor }}
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$FLAVOR_INPUT" == "stable" ]]; then
            if [ -f packaging/FLAVOR ]; then
              git update-index --skip-worktree packaging/FLAVOR
              rm packaging/FLAVOR
            fi
          fi
          echo "flavor: $(cat packaging/FLAVOR 2>/dev/null || echo stable)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # Cache pip's wheel cache between runs, keyed on the dependency
          # manifest: the vtk/scipy/opencv stack is most of each leg's
          # install time and it only changes when pyproject.toml does.
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Fetch macOS wheels that run on macOS 12
        if: runner.os == 'macOS'
        # numpy and scipy each ship two wheels per architecture, and the newer
        # one links the Accelerate LAPACK that arrived in macOS 13.3. pip on a
        # macOS 14 runner takes that newer wheel, and the result launches fine
        # on an older Mac and then dies the first time it smooths a trace:
        # "Symbol not found: _dstevr$NEWLAPACK", reported from macOS 12.4.
        #
        # MACOSX_DEPLOYMENT_TARGET does not help: it tells a COMPILER what to
        # target and says nothing about which prebuilt wheel pip downloads.
        # The platform has to be named outright, which is what --platform
        # does; --no-deps and --only-binary keep it from resolving anything
        # else for the wrong platform. These land before the project install,
        # so the project sees its pins already satisfied.
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            PLAT=macosx_12_0_arm64
          else
            PLAT=macosx_10_13_x86_64
          fi
          NUMPY=$(python -c "import re;print(re.search(r'numpy==([0-9.]+)', open('pyproject.toml').read()).group(1))")
          SCIPY=$(python -c "import re;print(re.search(r'scipy==([0-9.]+)', open('pyproject.toml').read()).group(1))")
          python -m pip install --upgrade pip
          python -m pip download --only-binary=:all: --no-deps \
            --platform "$PLAT" --python-version 311 --dest oldwheels \
            "numpy==$NUMPY" "scipy==$SCIPY"
          ls oldwheels
          python -m pip install --no-deps oldwheels/*.whl

      - name: Install project, build tools, PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools-scm "pyinstaller>=6,<7"
          python -m pip install -e .

      - name: Compute version
        shell: bash
        run: |
          V="$(python -m setuptools_scm)"
          case "$V" in
            0.0.0*|*unknown*)
              echo "::error::setuptools-scm produced a fallback version ($V) — missing tags or fetch-depth:0?"
              exit 1 ;;
          esac
          # A stable tag (v1.23.0) and a nightly tag (v1.24.0.dev20260928) both
          # spell the exact version the build must carry; anything else means a
          # dirty tree or a tag that is not on HEAD.
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.dev[0-9]{8})?$ && "$V" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::setuptools-scm produced $V for the tag $GITHUB_REF_NAME; is the tree dirty?"
            exit 1
          fi
          echo "PYR_VERSION=$V" >> "$GITHUB_ENV"
          echo "PYR_PUBLIC=${V%%+*}" >> "$GITHUB_ENV"

      - name: Smoke test (imports; offscreen render skipped on headless CI)
        env:
          QT_QPA_PLATFORM: offscreen
          PYRECON_SMOKE_SKIP_RENDER: "1"
        run: python packaging/smoke_test.py

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: bash packaging/macos/make_icns.sh

      - name: PyInstaller freeze
        run: pyinstaller --noconfirm packaging/PyReconstruct.spec

      - name: Report the frozen app's size (Windows)
        # Informational, for sizing in-place updates: bytes on disk, file
        # count, and the longest path inside the install folder (Windows path
        # limits apply to the install folder plus this). Never fails the build.
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            $flavor = ""
            if (Test-Path "packaging\FLAVOR") { $flavor = (Get-Content "packaging\FLAVOR" -Raw).Trim() }
            $app = if ($flavor -eq "dev") { "PyReconstruct Dev" } else { "PyReconstruct" }
            $root = (Resolve-Path -LiteralPath "dist\$app").Path.TrimEnd('\')
            $items = @(Get-ChildItem -LiteralPath $root -Recurse -Force)
            $files = @($items | Where-Object { -not $_.PSIsContainer })
            $bytes = ($files | Measure-Object -Property Length -Sum).Sum
            $longest = $items | ForEach-Object { $_.FullName.Substring($root.Length + 1) } |
              Sort-Object -Property Length -Descending | Select-Object -First 1
            Write-Host "frozen app: dist\$app"
            Write-Host "installed size: $bytes bytes"
            Write-Host "file count: $($files.Count)"
            Write-Host "longest relative path: $($longest.Length) characters ($longest)"
          } catch {
            Write-Host "::warning::could not measure the frozen app: $_"
          }
          exit 0

      - name: Report the frozen app's size (macOS)
        # Informational, as above, measured inside the .app bundle. Never
        # fails the build.
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          report() {
            FLAVOR="$(cat packaging/FLAVOR 2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$FLAVOR" = "dev" ]; then APP_NAME="PyReconstruct Dev"; else APP_NAME="PyReconstruct"; fi
            APP="dist/${APP_NAME}.app"
            [ -d "$APP" ] || { echo "::warning::$APP not found"; return 0; }
            BYTES="$(find "$APP" -type f -exec stat -f %z {} + | awk '{ s += $1 } END { print s + 0 }')"
            COUNT="$(find "$APP" -type f | wc -l | tr -d ' ')"
            LONGEST="$(cd "$APP" && find . -mindepth 1 | sed 's#^\./##' \
                       | awk '{ if (length($0) > m) { m = length($0); p = $0 } } END { print m + 0 " characters (" p ")" }')"
            echo "frozen app: $APP"
            echo "installed size: $BYTES bytes"
            echo "file count: $COUNT"
            echo "longest relative path: $LONGEST"
          }
          report || echo "::warning::could not measure the frozen app"
          exit 0

      - name: Frozen self-test (Windows) — catches windowed-only import bugs
        if: runner.os == 'Windows'
        run: |
          $flavor = ""
          if (Test-Path "packaging\FLAVOR") { $flavor = (Get-Content "packaging\FLAVOR" -Raw).Trim() }
          $app = if ($flavor -eq "dev") { "PyReconstruct Dev" } else { "PyReconstruct" }
          $p = Start-Process -FilePath "dist\$app\$app.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "frozen self-test failed (exit $($p.ExitCode))"; exit 1 }
          Write-Host "frozen self-test OK"

      - name: Import the Developer ID certificate (macOS)
        # Signing runs only where the five signing secrets exist, so a fork
        # without them still builds the unsigned app. The certificate goes into
        # a throwaway keychain that dies with the runner.
        id: macsign
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::notice::no signing secrets; building an unsigned app"
            echo "sign=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the certificate"; exit 1; }
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "sign=true" >> "$GITHUB_OUTPUT"

      - name: Sign the app (macOS)
        # Before the self-test, so the test runs the app exactly as users get it,
        # hardened runtime included.
        if: runner.os == 'macOS' && steps.macsign.outputs.sign == 'true'
        run: |
          FLAVOR="$(cat packaging/FLAVOR 2>/dev/null | tr -d '[:space:]' || true)"
          if [ "$FLAVOR" = "dev" ]; then APP_NAME="PyReconstruct Dev"; else APP_NAME="PyReconstruct"; fi
          bash packaging/macos/sign_app.sh "dist/${APP_NAME}.app"

      - name: Frozen self-test (macOS) — catches windowed-only import bugs
        if: runner.os == 'macOS'
        run: |
          FLAVOR="$(cat packaging/FLAVOR 2>/dev/null | tr -d '[:space:]' || true)"
          if [ "$FLAVOR" = "dev" ]; then APP_NAME="PyReconstruct Dev"; else APP_NAME="PyReconstruct"; fi
          "dist/${APP_NAME}.app/Contents/MacOS/${APP_NAME}" --selftest
          echo "frozen self-test OK"

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        run: |
          $flavor = ""
          if (Test-Path "packaging\FLAVOR") { $flavor = (Get-Content "packaging\FLAVOR" -Raw).Trim() }
          $args = @("/DPYR_VERSION=$env:PYR_PUBLIC")
          if ($flavor -eq "dev") { $args += "/DPYR_FLAVOR=dev" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" @args "packaging\windows\PyReconstruct.iss"
          New-Item -ItemType Directory -Force -Path dist-assets | Out-Null
          Move-Item "packaging\windows\Output\*.exe" dist-assets\

      - name: Refuse a macOS build that needs the new Accelerate
        if: runner.os == 'macOS'
        # The exact symbol from the crash report: scipy built against the
        # macOS 13.3+ Accelerate LAPACK. Reading it off the frozen app is the
        # only honest check, since the wheel tag is gone by then. Empty output
        # means the bundle runs on the older Macs too.
        run: |
          FLAVOR="$(cat packaging/FLAVOR 2>/dev/null | tr -d '[:space:]' || true)"
          if [ "$FLAVOR" = "dev" ]; then APP_NAME="PyReconstruct Dev"; else APP_NAME="PyReconstruct"; fi
          FOUND=$(find "dist/${APP_NAME}.app" -name "*.so" -exec nm -u {} + 2>/dev/null \
                  | grep -c 'NEWLAPACK' || true)
          if [ "$FOUND" -ne 0 ]; then
            echo "::error::$FOUND references to the macOS 13.3+ Accelerate LAPACK. This build would crash on older Macs the first time it smooths a trace."
            exit 1
          fi
          echo "no NEWLAPACK references; runs on macOS 12"

      - name: Build macOS dmg
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-assets
          ARCH="${{ matrix.arch }}" bash packaging/macos/make_dmg.sh
          mv PyReconstruct-*.dmg dist-assets/

      - name: Sign, notarize, and staple the dmg (macOS)
        # notarytool waits for Apple's verdict and fails the leg on a rejection,
        # printing Apple's log so the reason is in the run. The JSON parses may
        # fail on purpose (no JSON when notarytool itself fails), so they never
        # stop the step before the error line. Stapling attaches the
        # ticket to the dmg, so Gatekeeper accepts it with no network.
        if: runner.os == 'macOS' && steps.macsign.outputs.sign == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="$(ls dist-assets/PyReconstruct-*.dmg)"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          set +e
          OUT="$(xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
                 --team-id "$APPLE_TEAM_ID" --wait --timeout 45m --output-format json)"
          set -e
          echo "$OUT"
          ID="$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)"
          STATUS="$(echo "$OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || true)"
          if [ "$STATUS" != "Accepted" ]; then
            [ -n "$ID" ] && xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
            echo "::error::notarization status: ${STATUS:-no response}"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.plat }}-${{ matrix.arch }}
          path: dist-assets/*
          if-no-files-found: error

  build-linux:
    # The frozen Linux app, packaged as an AppImage. It is built inside an
    # AlmaLinux 8 container, so it links glibc 2.28, the README's Linux minimum
    # (Ubuntu 20.04, Debian 10, RHEL 8 and later); every pinned wheel (PySide6
    # 6.9.3 and pillow at manylinux_2_28, the rest at manylinux_2_17) installs
    # there. AlmaLinux's own python3.11 is used rather than a manylinux image's
    # Python, because PyInstaller needs the shared libpython that the manylinux
    # interpreters do not ship. The Linux installer tarball is still assembled
    # in the release job, unchanged.
    concurrency:
      group: build-installers-build-${{ github.ref }}-Linux-x86_64
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    container: almalinux:8
    steps:
      - name: Install the build system's packages
        # git before checkout, so it clones a real repository (setuptools-scm
        # reads the tags). The X and xcb libraries are the ones Qt's xcb
        # platform plugin links; PyInstaller copies those a desktop may lack
        # (libxcb-cursor, the xcb-util family, libxkbcommon-x11) into the
        # bundle, and the spec leaves the desktop's base libraries out.
        # libatomic is for QtPdf, which distributions do not always install.
        # xcb-util-cursor comes from EPEL.
        run: |
          dnf -y install epel-release
          dnf -y install git python3.11 python3.11-devel python3.11-pip \
            findutils file which desktop-file-utils libatomic \
            mesa-libGL mesa-libEGL libglvnd-opengl fontconfig freetype glib2 dbus-libs \
            libX11 libX11-xcb libXext libXrender libXi libXcursor libXrandr libXfixes libSM libICE \
            libxcb libxkbcommon libxkbcommon-x11 \
            xcb-util xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-cursor \
            libwayland-client libwayland-cursor libwayland-egl

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # setuptools-scm needs full history + tags

      - name: Trust the checkout
        # The container runs as root over a workspace the runner owns; without
        # this, git refuses the repository and setuptools-scm finds no tags.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Pick the build flavor
        # Runs before anything reads packaging/FLAVOR. A clean vX.Y.Z tag, or a
        # manual run with flavor=stable, builds the stable app by removing the
        # file. skip-worktree comes first because a plain delete leaves the tree
        # dirty, and setuptools-scm then stamps the version with a dirty-tree
        # date suffix, which the tag check below refuses.
        shell: bash
        env:
          FLAVOR_INPUT: ${{ inputs.flavor }}
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$FLAVOR_INPUT" == "stable" ]]; then
            if [ -f packaging/FLAVOR ]; then
              git update-index --skip-worktree packaging/FLAVOR
              rm packaging/FLAVOR
            fi
          fi
          echo "flavor: $(cat packaging/FLAVOR 2>/dev/null || echo stable)"

      - name: Install project, build tools, PyInstaller
        run: |
          python3.11 -m venv /opt/pyr
          echo /opt/pyr/bin >> "$GITHUB_PATH"
          /opt/pyr/bin/python -m pip install --upgrade pip
          /opt/pyr/bin/python -m pip install setuptools-scm "pyinstaller>=6,<7" pytest
          /opt/pyr/bin/python -m pip install -e .

      - name: Compute version
        shell: bash
        run: |
          V="$(python -m setuptools_scm)"
          case "$V" in
            0.0.0*|*unknown*)
              echo "::error::setuptools-scm produced a fallback version ($V) — missing tags or fetch-depth:0?"
              exit 1 ;;
          esac
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.dev[0-9]{8})?$ && "$V" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::setuptools-scm produced $V for the tag $GITHUB_REF_NAME; is the tree dirty?"
            exit 1
          fi
          echo "PYR_VERSION=$V" >> "$GITHUB_ENV"
          echo "PYR_PUBLIC=${V%%+*}" >> "$GITHUB_ENV"

      - name: Test the AppImage installer script
        run: python -m pytest -q -p no:cacheprovider tests/test_install_appimage_script.py tests/test_appimage_asset_names.py

      - name: Smoke test (imports; offscreen render skipped on headless CI)
        env:
          QT_QPA_PLATFORM: offscreen
          PYRECON_SMOKE_SKIP_RENDER: "1"
        run: python packaging/smoke_test.py

      - name: PyInstaller freeze
        shell: bash
        run: |
          set -o pipefail
          pyinstaller --noconfirm packaging/PyReconstruct.spec 2>&1 | tee pyinstaller.log
          echo "----- libraries PyInstaller could not find -----"
          grep -i "library not found\|could not find\|not found in" pyinstaller.log | sort -u || true
          echo "----- shared libraries bundled from the build system -----"
          find dist/*/_internal -maxdepth 1 -name 'lib*.so*' -printf '%f\n' | sort

      - name: Frozen self-test (Linux)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          FLAVOR="$(cat packaging/FLAVOR 2>/dev/null | tr -d '[:space:]' || true)"
          if [ "$FLAVOR" = "dev" ]; then APP_NAME="PyReconstruct Dev"; else APP_NAME="PyReconstruct"; fi
          "dist/${APP_NAME}/${APP_NAME}" --selftest
          echo "frozen self-test OK"

      - name: Build the AppImage
        # appimagetool and its runtime are pinned by release and checksum.
        shell: bash
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o /tmp/runtime-x86_64 https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c -
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/runtime-x86_64" | sha256sum -c -
          chmod +x /tmp/appimagetool
          APPIMAGETOOL=/tmp/appimagetool APPIMAGE_RUNTIME=/tmp/runtime-x86_64 bash packaging/linux/make_appimage.sh
          cd dist-assets && sha256sum *.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: installer-Linux-x86_64
          path: dist-assets/*.AppImage
          if-no-files-found: error

  test-appimage:
    # The AppImage on the distributions people run, each with only the base
    # libraries a desktop already has (the list per distribution is below).
    # --appimage-extract-and-run needs no FUSE, which containers lack. Nothing
    # here publishes, and the release job does not wait on it.
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop baseline: GL (libglvnd + Mesa), EGL, fontconfig/freetype,
          # glib, dbus, X11/xcb, expat, zlib, libstdc++, and the Kerberos GSSAPI
          # library QtNetwork links. A GNOME or KDE desktop has all of these; a
          # bare container has almost none. Wayland and GTK stay optional: Qt
          # loads its wayland and gtk3 plugins only in a session that has them.
          - image: ubuntu:20.04
            install: apt
            pkgs: libgl1 libegl1 libopengl0 libfontconfig1 libfreetype6 libglib2.0-0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libexpat1 zlib1g libgssapi-krb5-2
          - image: ubuntu:22.04
            install: apt
            pkgs: libgl1 libegl1 libopengl0 libfontconfig1 libfreetype6 libglib2.0-0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libexpat1 zlib1g libgssapi-krb5-2
          - image: ubuntu:24.04
            install: apt
            pkgs: libgl1 libegl1 libopengl0 libfontconfig1 libfreetype6 libglib2.0-0t64 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libexpat1 zlib1g libgssapi-krb5-2
          - image: debian:12
            install: apt
            pkgs: libgl1 libegl1 libopengl0 libfontconfig1 libfreetype6 libglib2.0-0 libdbus-1-3 libx11-6 libx11-xcb1 libxcb1 libexpat1 zlib1g libgssapi-krb5-2
          - image: fedora:latest
            install: dnf
            pkgs: mesa-libGL mesa-libEGL libglvnd-opengl fontconfig freetype glib2 dbus-libs libX11 libX11-xcb libxcb expat zlib-ng-compat krb5-libs
    name: test-appimage (${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      # No git in these images, so checkout downloads the tree through the
      # API; only the installer script and its test harness are used.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: installer-Linux-x86_64
          path: appimage

      - name: Install the desktop baseline
        env:
          PKGS: ${{ matrix.pkgs }}
        run: |
          if [ "${{ matrix.install }}" = apt ]; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $PKGS
          else
            dnf -y -q install $PKGS
          fi
          chmod +x appimage/*.AppImage
          ls -l appimage

      - name: Libraries this system still lacks
        run: |
          AI="$PWD/$(ls appimage/*.AppImage)"
          mkdir -p /tmp/x && cd /tmp/x && "$AI" --appimage-extract >/dev/null
          INTERNAL="$(find /tmp/x/squashfs-root/usr/lib -maxdepth 2 -name _internal -type d | head -n 1)"
          find /tmp/x/squashfs-root/usr/lib -name '*.so*' -type f | while read -r f; do
            LD_LIBRARY_PATH="$INTERNAL" ldd "$f" 2>/dev/null | grep "not found" | sed "s|^|$(basename "$f"): |"
          done | sort -u > /tmp/missing.txt || true
          echo "Qt platform plugins:"
          grep -E "^libq(xcb|offscreen|wayland)" /tmp/missing.txt || echo "  nothing missing"
          echo "Everything (plugins for optional features included):"
          cat /tmp/missing.txt
          # A bundled library older than the host's shadows it, and the host's
          # own libraries then miss a symbol version. That is a bundling bug.
          if grep -q "version \`.*' not found" /tmp/missing.txt; then
            echo "::error::a bundled library is older than the one this system's libraries need"
            exit 1
          fi
          rm -rf /tmp/x

      - name: Frozen self-test inside the AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          AI="$(ls appimage/*.AppImage)"
          "$AI" --appimage-extract-and-run --selftest
          echo "AppImage self-test OK on ${{ matrix.image }}"

      - name: Install it with install-appimage.sh and run the launcher
        # The installer against a local stand-in for the releases API, serving
        # the AppImage just built, then the self-test through the launcher it
        # wrote. python3 is for the stand-in server only.
        run: |
          if [ "${{ matrix.install }}" = apt ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 curl
          else
            dnf -y -q install python3 curl
          fi
          AI="$(ls appimage/*.AppImage)"
          case "$AI" in *-Dev.AppImage) FLAVOR=dev; FLAG=--dev; CMD=pyreconstruct-dev ;; *) FLAVOR=stable; FLAG=; CMD=pyreconstruct ;; esac
          SRC="$(mktemp -d)"
          cp packaging/linux/install-appimage.sh tests/linux_installer_harness.py "$SRC"/
          python3 "$SRC/linux_installer_harness.py" --appimage "$AI" --flavor "$FLAVOR" \
            --version 1.99.0.dev20260101 --port-file "$SRC/api" &
          for i in $(seq 50); do [ -s "$SRC/api" ] && break; sleep 0.2; done
          export HOME="$(mktemp -d)"
          PYRECON_RELEASES_API="$(cat "$SRC/api")" sh "$SRC/install-appimage.sh" $FLAG
          ls -la "$HOME/.local/share"/*/ "$HOME/.local/bin" "$HOME/.local/share/applications"
          cat "$HOME/.local/share/applications/"*.desktop
          QT_QPA_PLATFORM=offscreen "$HOME/.local/bin/$CMD" --selftest
          PYRECON_RELEASES_API="$(cat "$SRC/api")" sh "$SRC/install-appimage.sh" $FLAG
          sh "$SRC/install-appimage.sh" --uninstall $FLAG
          test ! -e "$HOME/.local/bin/$CMD"

      - name: Start the GUI on the xcb platform under Xvfb (report only)
        # --selftest never opens a window, so it cannot show that Qt's xcb
        # plugin loads. This starts the real app on a virtual X display and
        # passes when it is still running after 40 seconds. Xvfb pulls in more
        # X libraries than a desktop needs, so it runs after the tests above.
        continue-on-error: true
        run: |
          if [ "${{ matrix.install }}" = apt ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends xvfb procps
          else
            dnf -y -q install xorg-x11-server-Xvfb procps-ng
          fi
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          sleep 3
          AI="$(ls appimage/*.AppImage)"
          set +e
          DISPLAY=:99 QT_QPA_PLATFORM=xcb QT_DEBUG_PLUGINS=0 timeout 40 "$AI" --appimage-extract-and-run > /tmp/gui.log 2>&1
          rc=$?
          set -e
          tail -n 40 /tmp/gui.log
          if [ "$rc" = 124 ]; then echo "GUI still running after 40 s on xcb: OK"; exit 0; fi
          echo "::warning::GUI exited with $rc on xcb (${{ matrix.image }})"
          exit 1

  release:
    needs: [build, build-linux]
    # publish whatever built, even if one matrix leg failed (don't hide a good installer)
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && (needs.build.result == 'success' || needs.build.result == 'failure') && (needs.build-linux.result == 'success' || needs.build-linux.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # dispatches prune-nightlies and link-check after a publish
    steps:
      - uses: actions/checkout@v7          # needed for packaging/linux/ + release notes
        with:
          fetch-depth: 0                   # full history + tags for the changelog link
      - name: Pick the build flavor
        # Runs before anything reads packaging/FLAVOR. A clean vX.Y.Z tag, or a
        # manual run with flavor=stable, builds the stable app by removing the
        # file. skip-worktree comes first because a plain delete leaves the tree
        # dirty, and setuptools-scm then stamps the version with a dirty-tree
        # date suffix, which the tag check below refuses.
        shell: bash
        env:
          FLAVOR_INPUT: ${{ inputs.flavor }}
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$FLAVOR_INPUT" == "stable" ]]; then
            if [ -f packaging/FLAVOR ]; then
              git update-index --skip-worktree packaging/FLAVOR
              rm packaging/FLAVOR
            fi
          fi
          echo "flavor: $(cat packaging/FLAVOR 2>/dev/null || echo stable)"
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Package the Linux .sh installer
        # The Linux installer is a script bundle (no frozen binary), so it has no
        # build-matrix leg — assemble it here and ship it as a release asset.
        run: |
          # Name the asset with the PEP 440 public version (what setuptools-scm
          # bakes in, and what the frozen mac/Windows assets use) rather than the
          # raw tag, so a v1.21.0-rc.1 tag yields 1.21.0rc1 like the others (a
          # nightly's v1.24.0.dev20260928 is already normalized). The
          # install-source pin below still uses the exact tag ref.
          python3 -m pip install --quiet --disable-pip-version-check packaging
          VERSION="$(python3 -c "from packaging.version import Version; print(Version('${GITHUB_REF_NAME#v}'))")"
          STAGE="PyReconstruct-linux-installer"
          mkdir -p "$STAGE"
          cp packaging/linux/install.sh packaging/linux/uninstall.sh \
             packaging/linux/pyreconstruct.desktop.in packaging/linux/README.md "$STAGE"/
          # Standalone installs pin to this exact tag, so a vX.Y.Z asset installs
          # vX.Y.Z (not bleeding main).
          sed -i "s#DEFAULT_SOURCE=\"git+https://github.com/dustenhubbard/PyReconstruct.git\"#DEFAULT_SOURCE=\"git+https://github.com/dustenhubbard/PyReconstruct.git@${GITHUB_REF_NAME}\"#" "$STAGE/install.sh"
          # sed exits 0 even when the pattern matched nothing; if the
          # DEFAULT_SOURCE line in install.sh ever drifts, an unverified sed
          # would silently ship an installer that installs bleeding main
          # instead of this tag. Fail the release loudly instead.
          grep -qF "PyReconstruct.git@${GITHUB_REF_NAME}\"" "$STAGE/install.sh" || {
            echo "::error::Linux installer version pin did not apply — DEFAULT_SOURCE line in packaging/linux/install.sh no longer matches the sed pattern above"
            exit 1
          }
          FLAVOR="$(cat packaging/FLAVOR 2>/dev/null | tr -d '[:space:]' || true)"
          SUFFIX=""
          [ "$FLAVOR" = "dev" ] && SUFFIX="-Dev"
          tar -czf "dist/PyReconstruct-${VERSION}-Linux-installer${SUFFIX}.tar.gz" "$STAGE"
      - name: Generate checksums
        run: cd dist && for f in *; do [ -f "$f" ] && sha256sum "$f" > "$f.sha256"; done
      - name: Build nightly release notes
        # A nightly gets GitHub's auto-generated notes (the merged pull requests
        # and a compare link), measured against the previous release on the
        # same channel: the newest OTHER nightly by date, or the newest stable
        # when this is the first nightly. Nobody curates a nightly's notes, and
        # the dev audience reads the pull-request list fine. The stable step
        # below is skipped for a nightly and vice versa; both write
        # release_body.md.
        #
        # softprops/action-gh-release can generate notes itself but cannot be
        # told the previous tag, so this asks the releases API directly.
        if: contains(github.ref_name, '.dev')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          NIGHTLY_RE='^v[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]{8}$'
          STABLE_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
          PREV="$(git tag --list 'v*' | grep -E "$NIGHTLY_RE" | grep -vxF "$GITHUB_REF_NAME" \
            | awk -F'[.]dev' '{ print $2, $0 }' | sort -k1,1n -k2,2V | tail -n 1 | cut -d' ' -f2 || true)"
          if [ -z "$PREV" ]; then
            PREV="$(git tag --list 'v*' | grep -E "$STABLE_RE" | sort -V | tail -n 1 || true)"
          fi
          echo "previous release on the nightly channel: ${PREV:-none}"
          {
            echo "Nightly build of PyReconstruct Dev from main at $(git rev-parse --short HEAD)."
            echo ""
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" -f target_commitish="$GITHUB_SHA" \
              ${PREV:+-f previous_tag_name="$PREV"} --jq '.body'
          } > release_body.md
          echo "----- release_body.md -----"; cat release_body.md
      - name: Build friendly release notes
        # User-facing highlights from WHATS_NEW.md + a single link to the technical
        # changelog -- deliberately NOT GitHub's auto-generated "What's Changed" list,
        # which reads as developer jargon to general users. Not for a nightly,
        # which has no WHATS_NEW section and takes the step above instead.
        if: ${{ !contains(github.ref_name, '.dev') }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## What's new in ${VERSION}"
            awk -v ver="$VERSION" '
              /^##[ \t]+\[/ { t=$0; sub(/^##[ \t]+\[/,"",t); sub(/\].*/,"",t); sub(/^[vV]/,"",t); cap=(t==ver); next }
              cap { print }
            ' WHATS_NEW.md
            echo ""
            echo "---"
            PREV=$(git tag --sort=-version:refname | awk -v c="$GITHUB_REF_NAME" 'found{print; exit} $0==c{found=1}')
            if [ -n "$PREV" ]; then
              echo "_For developers, the full technical changelog:_ **[compare ${PREV} → ${GITHUB_REF_NAME}](https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME})**"
            else
              echo "_For developers, the full technical changelog:_ **[commit history](https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME})**"
            fi
          } > release_body.md
          echo "----- release_body.md -----"; cat release_body.md
      - name: Classify release
        # Only a clean vX.Y.Z tag is a stable release; anything else -- a
        # nightly (v1.24.0.dev20260928), a PEP 440-normalized pre-release
        # (v1.20.4rc1), a dashed one (v1.20.4-rc.1), or an alpha (v1.30.0a1) --
        # publishes as a GitHub pre-release. A plain contains('-') check
        # misclassifies the dashless v1.20.4rc1 as stable. A nightly is also
        # flagged on its own so the publish step can keep it off "latest" and
        # the prune step can tell it from a stable.
        id: rel
        env:
          STAGE: ${{ vars.STAGE_RELEASE_AS_DRAFT }}
        run: |
          IS_NIGHTLY=false
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            IS_STABLE=true
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            IS_STABLE=false
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]{8}$ ]] && IS_NIGHTLY=true
          fi
          echo "nightly=$IS_NIGHTLY" >> "$GITHUB_OUTPUT"
          # "Latest" is the release GitHub's /releases/latest redirect and the
          # README's download links point at. Only a stable may hold it; a
          # pre-release cannot by GitHub's own rule, and saying so explicitly
          # keeps a nightly from ever being offered as the download.
          echo "make_latest=$IS_STABLE" >> "$GITHUB_OUTPUT"
          # Draft policy, decided once here so the publish step and the prune step
          # cannot disagree. Default: stage a STABLE release as a hidden draft, and
          # publish a PRE-RELEASE immediately. Rationale: the draft is an
          # asset-completeness gate (did all 8 installers actually attach?), which
          # matters most where the release reaches every user; a nightly should be
          # on the page by morning with nobody in the loop.
          # Override with the repo variable STAGE_RELEASE_AS_DRAFT:
          #   unset / "auto" -> draft iff stable   (the default)
          #   "true"         -> always draft       (e.g. staging a pre-release for a live demo)
          #   "false"        -> never draft
          case "${STAGE:-auto}" in
            true)  DRAFT=true ;;
            false) DRAFT=false ;;
            *)     DRAFT=$IS_STABLE ;;
          esac
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ steps.rel.outputs.prerelease }}
          # Only a stable becomes the repository's latest release; a nightly
          # (or any other pre-release) never does, so the /releases/latest
          # redirect and the in-app stable channel keep pointing at the stable.
          make_latest: ${{ steps.rel.outputs.make_latest }}
          # Draft decision is computed in the `rel` step above (stable -> draft,
          # pre-release -> publish now, overridable via STAGE_RELEASE_AS_DRAFT).
          # A staged draft is invisible to the in-app updater until published;
          # assets are pre-built, so publishing goes live instantly.
          draft: ${{ steps.rel.outputs.draft == 'true' }}
          # release_body.md comes from whichever notes step ran: the generated
          # notes for a nightly, the WHATS_NEW highlights for everything else.
          body_path: release_body.md
      - name: Prune superseded pre-releases
        # A published stable vX.Y.Z supersedes its own pre-releases (the
        # nightlies v1.21.0.devYYYYMMDD, and v1.21.0rc1, v1.21.0-rc.1,
        # v1.21.0a1, ...): delete their GitHub Releases and assets so the
        # Releases page and the in-app updater only offer the stable.
        # Keep Git tags as release-history evidence for the notes checks.
        # scripts/prune_prereleases.py scopes the selection to the
        # exact X.Y.Z line -- the stable itself and every other version line
        # are never touched. Skipped when staging as a draft: the stable is
        # still hidden then, and pruning would leave the line with no visible
        # release (clean up by hand after publishing a staged draft).
        if: steps.rel.outputs.prerelease == 'false' && steps.rel.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail   # a helper/list failure should flag loudly, not silently skip the prune
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
            | python3 scripts/prune_prereleases.py "$GITHUB_REF_NAME" \
            | while read -r t; do
                echo "pruning superseded pre-release: $t"
                gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes
              done

      - name: Kick the publish-time workflows
        # A release published with the workflow's own token never fires the
        # `release: published` triggers (GitHub's recursion guard), so
        # prune-nightlies and link-check only ran for hand-published releases;
        # the 1.23.0 pre-release cycle proved it by firing neither.
        # workflow_dispatch is exempt from the guard, so the publish path
        # dispatches them here. For a nightly this is also what enforces the
        # keep-the-newest-seven policy, since every nightly publishes from
        # here. Skipped for drafts: nothing is public yet, so there is nothing
        # to prune or check; the hand-publish of the draft fires the release
        # triggers itself.
        if: steps.rel.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run prune-nightlies.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run link-check.yml --repo "$GITHUB_REPOSITORY"

      - name: Prune orphaned draft-placeholder tags
        # Staging a release as a draft makes GitHub mint a placeholder tag named
        # `untagged-<hex>`, because a draft has no real tag to point at yet.
        # Publishing the draft creates the real vX.Y.Z tag and leaves the
        # placeholder behind, referenced by nothing.
        #
        # That leftover BREAKS BUILDS. vcs-versioning runs `git describe`, cannot
        # parse `untagged-87b5beb96d79ab5ff1c1`, and raises -- so every branch whose
        # nearest tag is the placeholder fails to build outright. The one left by the
        # v1.21.1 draft broke `uv run` on a dev machine three days later.
        #
        # Runs unconditionally, unlike the prune above: the orphan is created by the
        # DRAFT path and only becomes an orphan once that draft is published, so
        # gating this on the same condition would never clean up the case that
        # produces it. It is idempotent and clears leftovers from earlier cycles too.
        #
        # `gh api .../releases` rather than `gh release list`: the API returns DRAFTS,
        # and a live draft's placeholder is load-bearing -- it is the only thing that
        # release points at. That list is what the helper treats as in-use, and an
        # empty one makes it select nothing, so a failed lookup is a no-op rather
        # than a mass deletion.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail   # a failed lookup must flag loudly, not feed an empty list onward
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' > /tmp/tags-in-use.txt
          git ls-remote --tags origin \
            | sed 's|.*refs/tags/||; s|\^{}$||' \
            | sort -u \
            | python3 scripts/prune_untagged_placeholders.py /tmp/tags-in-use.txt \
            | while read -r t; do
                echo "deleting orphaned draft-placeholder tag: $t"
                git push origin ":refs/tags/$t"
              done

  readme-bump:
    # A stable tag makes the README's direct-download table stale the moment
    # the release publishes, and the bump was a hand-made PR every release
    # until it was forgotten one time too many (v1.22.0 shipped while the
    # table still said v1.21.2). This opens that PR automatically. It edits
    # only the three shapes the table uses -- the bold version callout, the
    # /releases/download/vX.Y.Z/ path, and the versioned asset filenames --
    # so prose examples elsewhere in the README (a pre-release tag named in
    # the updater section) are left alone. Label and merge stay human steps,
    # per the repo's gate discipline. Pre-release tags, nightlies included,
    # skip this entirely.
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Open the bump PR (stable tags only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "pre-release tag; no bump"; exit 0; }
          VERSION="${GITHUB_REF_NAME#v}"
          sed -E -i \
            -e "s|(releases/download/)v[0-9]+\.[0-9]+\.[0-9]+/|\1v${VERSION}/|g" \
            -e "s#PyReconstruct-[0-9]+\.[0-9]+\.[0-9]+-(Windows|macOS|Linux|linux)#PyReconstruct-${VERSION}-\1#g" \
            -e "s|current stable release, \*\*v[0-9]+\.[0-9]+\.[0-9]+\*\*|current stable release, **v${VERSION}**|" \
            README.md
          git diff --quiet README.md && { echo "README already current"; exit 0; }
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          BRANCH="docs/readme-v${VERSION}"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "docs(readme): point the download links at v${VERSION}" \
            -m "Opened by the release build so the direct-download table never trails a stable release again."
          git push -f origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "docs(readme): point the download links at v${VERSION}" \
            --body "The v${VERSION} release just published; this points the README's direct-download table at it. Opened automatically by the release build. Label and merge as usual." \
            || echo "PR already open for $BRANCH"
