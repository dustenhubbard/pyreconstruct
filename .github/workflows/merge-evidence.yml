# Server-side merge-evidence gate (postmortem-drain-2026-08-02, H3').
#
# Reports a check named `merge-evidence` that succeeds only when the PR carries the
# `reviewed` label. Once this context is in branch protection's required checks, a merge
# with no review evidence fails AT GITHUB -- no matter what issued it: a wrapper script,
# an alias, a `gh pr merge` the command-text guard never saw. This is the transport-level
# answer to the #209 bypass, per the repo's own precedent that command-text guards cannot
# close that class (vcs-guard-hook.md, accepted gap 3).
#
# Deliberately label-only. The label is the durable evidence vcs-guard already requires
# and is applied once a pull request has been checked; an approving review satisfies the
# maintainer path by him adding the label, which is one click. Checking reviews here too
# would need a second trigger (`pull_request_review`) whose check runs land on a separate
# event and race the label runs for "latest" -- complexity that buys nothing the label
# does not already give.
#
# Main's copy only. On `pull_request_target`, GitHub runs the copy of this file on main,
# not the PR head's, so a PR that edits this file cannot weaken the check. Its check
# lands on the PR head commit under the `merge-evidence` name. There is no `pull_request`
# trigger, so the head copy reports nothing. A change to this file takes effect for
# other PRs only after it is on main.
#
# No checkout, no code execution, and it must stay that way: `pull_request_target` hands
# the job a token for this repository, which is safe only because no step checks out or
# runs code from the PR head. Every step reads the event payload or the GitHub API, and
# every value reaches the shell through `env:`, never spliced into a script.
#
# Limit: branch protection matches a required check by name and app (GitHub Actions)
# alone, so a PR that adds its own `pull_request` workflow with a job named
# `merge-evidence` reports a second check of that name from the same app. The ruleset
# rule that pins a check to one workflow file ("Require workflows to pass") is for
# organization repos only, so it is not open to this one. The cover here: a PR that
# changes anything under .github/workflows/ fails this check until it also has the
# `workflows-reviewed` label (step below). Every check of the name counts, so a red
# run here blocks whatever else reports the name. I apply that label myself, after
# reading the workflow change.
#
# Limit: GitHub may skip `pull_request_target` for a branch whose name looks like a
# commit SHA. Such a PR gets no `merge-evidence` report and cannot merge until its
# branch is renamed. It fails closed, so no unreviewed change can merge that way.
#
# Merge hold: while the repository variable MERGE_HOLD is `1`, this check fails on
# every PR, so nothing merges. Set and clear it on the repository's Settings page
# (Secrets and variables, Actions, Variables) or with
#   gh variable set MERGE_HOLD -R dustenhubbard/pyreconstruct --body 1   (0 clears it)
# A variable change is not an event, so it re-runs nothing by itself. A check that
# passed before the hold stays green, and one failed by the hold stays red after it is
# cleared. merge-hold-sync.yml closes that gap: every 15 minutes, or at once with
#   gh workflow run merge-hold-sync.yml -R dustenhubbard/pyreconstruct
# it adds a failed `merge-evidence` check run to each open PR while the hold is set,
# and on clearing marks those passed and re-runs this check where the hold failed it.
# Any new push or label change on a PR runs this check again too.

name: merge-evidence

on:
  # The only trigger. A `pull_request` trigger would run the PR head's copy, which the
  # PR itself can edit, under the same check name.
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]

# pull-requests: read lets the steps list the PR's commits through the API.
permissions:
  pull-requests: read

jobs:
  merge-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: merge hold
        # First, so a hold stops every PR, Dependabot's included. The sync script
        # (scripts/merge_hold_sync.py) finds a hold failure by this step's name;
        # rename both together.
        env:
          MERGE_HOLD: ${{ vars.MERGE_HOLD }}
        run: |
          if [ "$MERGE_HOLD" = 1 ]; then
            echo "::error::Merge hold in force (repository variable MERGE_HOLD is 1). Nothing merges until it is cleared."
            exit 1
          fi
          echo "no merge hold"

      - name: read the dependabot update type
        # Dependabot's own action, pinned as in dependabot-auto.yml. It reads the PR's
        # first commit through the API and reports no update type unless that commit is
        # by dependabot[bot] and carries GitHub's verified signature. It does not look
        # at later commits; the next step does. If it fails, the type stays empty and
        # the label is required.
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        continue-on-error: true
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a  # v2.5.0
        with:
          github-token: ${{ github.token }}

      - name: routine dependency PRs are vouched for by the suite
        # The one exception to label-only evidence, added 2026-08-24: a
        # dependabot patch or minor bump merges on green checks alone (see
        # dependabot-auto.yml for the policy and the reason). A major bump, an
        # unknown update type, or a dependabot branch with any other commit needs
        # the label like any other PR. The author on a commit is only an email
        # that anyone who can push to the branch can set. Every commit must have
        # Dependabot author attribution, web-flow as committer, and a verified
        # signature. These checks reject unsigned commits and other committers.
        # They do not prove that Dependabot produced the changes.
        # A Dependabot commit that is not verified needs the `reviewed` label
        # like any other PR.
        id: dep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          skip=false
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "not a dependabot PR"
          elif [ "$UPDATE_TYPE" != version-update:semver-patch ] \
               && [ "$UPDATE_TYPE" != version-update:semver-minor ]; then
            echo "dependabot update type '${UPDATE_TYPE:-unknown}' -- the label is required"
          else
            others=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
              --jq '.[] | select(.author.login != "dependabot[bot]"
                                 or .committer.login != "web-flow"
                                 or .commit.verification.verified != true) | .sha[0:8]')
            if [ -n "$others" ]; then
              echo "commits missing Dependabot attribution, a web-flow committer, or a verified signature; the label is required:"
              echo "$others"
            else
              echo "dependabot $UPDATE_TYPE -- the test suite is the evidence"
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: require the `reviewed` label
        if: steps.dep.outputs.skip != 'true'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # An exact, case-sensitive match on each label name. A pattern over the joined
          # names would let a label such as "x,reviewed,y" pass.
          if jq -e 'any(.[]; . == "reviewed")' <<<"$LABELS" >/dev/null; then
            echo "reviewed label present -- evidence recorded"
          else
            echo "::error::No 'reviewed' label. A merge to main needs it."
            exit 1
          fi

      - name: changes under .github/workflows need `workflows-reviewed`
        # A PR that adds or edits a workflow can add a second check named
        # `merge-evidence` (see the limit above). This copy runs from main, so it can
        # ask for a second label on any such PR, one the PR cannot give itself. It
        # applies to Dependabot too: its action bumps edit workflow files, and the
        # checks above do not prove a commit came from Dependabot.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # The API lists at most 3000 files per PR.
          if [ "$CHANGED" -gt 3000 ]; then
            echo "::error::This PR changes $CHANGED files and the API lists only 3000. Split it so every file can be checked."
            exit 1
          fi
          # A rename counts at both ends: moving a workflow out is a change to it.
          hits=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty) | select(startswith(".github/workflows/"))')
          if [ -z "$hits" ]; then
            echo "no change under .github/workflows/"
            exit 0
          fi
          echo "$hits"
          if jq -e 'any(.[]; . == "workflows-reviewed")' <<<"$LABELS" >/dev/null; then
            echo "workflows-reviewed label present"
          else
            echo "::error::This PR changes files under .github/workflows/. A merge needs the 'workflows-reviewed' label as well as 'reviewed'."
            exit 1
          fi

      - name: check PR commit messages
        # Refuse a PR whose commit messages carry a trailer line this repo does not
        # accept. Reads commit messages through the API; nothing from the PR head runs.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          # The API lists at most 250 commits per PR, so a longer branch could hide one.
          if [ "$COMMITS" -gt 250 ]; then
            echo "::error::This PR has $COMMITS commits and the API lists only 250. Squash the branch so every commit can be checked."
            exit 1
          fi
          hits=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | select(.commit.message | test("(^|\n)co-authored-by[ \t]*:"; "i")) | .sha[0:8]')
          if [ -n "$hits" ]; then
            for sha in $hits; do
              echo "::error::Commit $sha has a trailer line this repo does not accept. Remove it and force-push the branch."
            done
            exit 1
          fi
          echo "commit messages checked"
