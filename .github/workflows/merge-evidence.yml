# Server-side merge-evidence gate (postmortem-drain-2026-08-02, H3').
#
# Reports a check named `merge-evidence` that succeeds only when the PR carries the
# `reviewed` label. Once this context is in branch protection's required checks, a merge
# with no review evidence fails AT GITHUB -- no matter what issued it: a wrapper script,
# an alias, a `gh pr merge` the command-text guard never saw. This is the transport-level
# answer to the #209 bypass, per the repo's own precedent that command-text guards cannot
# close that class (vcs-guard-hook.md, accepted gap 3).
#
# Deliberately label-only. The label is the durable evidence vcs-guard already requires
# and is applied once a pull request has been checked; an approving review satisfies the
# maintainer path by him adding the label, which is one click. Checking reviews here too
# would need a second trigger (`pull_request_review`) whose check runs land on a separate
# event and race the label runs for "latest" -- complexity that buys nothing the label
# does not already give.
#
# Moving to main's copy, step one of two. On `pull_request_target`, GitHub runs the copy
# of this file on main, not the PR head's, so a PR that edits this file cannot weaken
# that run. Its check lands on the PR head commit under the same `merge-evidence` name.
# For now `pull_request` stays too (see `on:`), so the head copy reports a check of the
# same name as well, and both copies require the label. Branch protection does not say
# which of the two it reads. Main's copy decides alone only once a later change drops
# `pull_request`.
#
# No checkout, no code execution, and it must stay that way: `pull_request_target` hands
# the job a token for this repository, which is safe only because no step checks out or
# runs code from the PR head. Every step reads the event payload or the GitHub API, and
# every value reaches the shell through `env:`, never spliced into a script.
#
# Limit: branch protection matches a required check by name alone, so a PR that adds its
# own `pull_request` workflow with a job named `merge-evidence` reports a second check of
# that name. Dropping `pull_request` here does not close that; only a GitHub ruleset
# does, and none is set up. Read any change under .github/workflows/ with that in mind.

name: merge-evidence

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  # Switch-over only. GitHub reads a `pull_request_target` trigger from main's copy, so
  # until this file is on main with that trigger, only the head copy can report the
  # check. Drop `pull_request` in the next change to this file.
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

# pull-requests: read lets the steps list the PR's commits through the API.
permissions:
  pull-requests: read

jobs:
  merge-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: read the dependabot update type
        # Dependabot's own action, pinned as in dependabot-auto.yml. It reads the PR's
        # first commit through the API and reports no update type unless that commit is
        # by dependabot[bot] and carries GitHub's verified signature. It does not look
        # at later commits; the next step does. If it fails, the type stays empty and
        # the label is required.
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        continue-on-error: true
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a  # v2.5.0
        with:
          github-token: ${{ github.token }}

      - name: routine dependency PRs are vouched for by the suite
        # The one exception to label-only evidence, added 2026-08-24: a
        # dependabot patch or minor bump merges on green checks alone (see
        # dependabot-auto.yml for the policy and the reason). A major bump, an
        # unknown update type, or a dependabot branch with any other commit needs
        # the label like any other PR. The author on a commit is only an email
        # that anyone who can push to the branch can set. Every commit must have
        # Dependabot author attribution, web-flow as committer, and a verified
        # signature. These checks reject unsigned commits and other committers.
        # They do not prove that Dependabot produced the changes.
        # A Dependabot commit that is not verified needs the `reviewed` label
        # like any other PR.
        id: dep
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          skip=false
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "not a dependabot PR"
          elif [ "$UPDATE_TYPE" != version-update:semver-patch ] \
               && [ "$UPDATE_TYPE" != version-update:semver-minor ]; then
            echo "dependabot update type '${UPDATE_TYPE:-unknown}' -- the label is required"
          else
            others=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
              --jq '.[] | select(.author.login != "dependabot[bot]"
                                 or .committer.login != "web-flow"
                                 or .commit.verification.verified != true) | .sha[0:8]')
            if [ -n "$others" ]; then
              echo "commits missing Dependabot attribution, a web-flow committer, or a verified signature; the label is required:"
              echo "$others"
            else
              echo "dependabot $UPDATE_TYPE -- the test suite is the evidence"
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: require the `reviewed` label
        if: steps.dep.outputs.skip != 'true'
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # An exact, case-sensitive match on each label name. A pattern over the joined
          # names would let a label such as "x,reviewed,y" pass.
          if jq -e 'any(.[]; . == "reviewed")' <<<"$LABELS" >/dev/null; then
            echo "reviewed label present -- evidence recorded"
          else
            echo "::error::No 'reviewed' label. A merge to main needs it."
            exit 1
          fi

      - name: check PR commit messages
        # Refuse a PR whose commit messages carry a trailer line this repo does not
        # accept. Reads commit messages through the API; nothing from the PR head runs.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          # The API lists at most 250 commits per PR, so a longer branch could hide one.
          if [ "$COMMITS" -gt 250 ]; then
            echo "::error::This PR has $COMMITS commits and the API lists only 250. Squash the branch so every commit can be checked."
            exit 1
          fi
          hits=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | select(.commit.message | test("(^|\n)co-authored-by[ \t]*:"; "i")) | .sha[0:8]')
          if [ -n "$hits" ]; then
            for sha in $hits; do
              echo "::error::Commit $sha has a trailer line this repo does not accept. Remove it and force-push the branch."
            done
            exit 1
          fi
          echo "commit messages checked"
