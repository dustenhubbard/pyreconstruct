# Prune beta releases nobody should install anymore.
#
# Two rules, decided by scripts/prune_betas.py (stdlib, unit-tested):
#   1. OVERTAKEN: a beta whose base version is at or below the newest stable
#      (the releases page kept showing v1.22.1-beta-1 after v1.22.1 shipped).
#   2. SUPERSEDED: within the current line, only the newest TWO betas stay --
#      the one the updater offers plus one rollback (his call, 2026-08-28).
#
# Runs when a release publishes and by hand. Deletes the release AND its tag.
# Guardrails: only prereleases, only tags shaped vX.Y.Z-beta-N, never drafts,
# never stables, and nothing at all when no stable release exists.

name: prune-betas

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Delete overtaken and superseded betas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.draft==false) | "\(.tag_name) \(.prerelease)"')

          pruned=0
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "pruning $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            pruned=$((pruned + 1))
          done < <(python3 scripts/prune_betas.py <<<"$releases")
          echo "pruned $pruned beta release(s)"
