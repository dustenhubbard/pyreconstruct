name: class-site

# Build the class site from the class branch and deploy it to the Cloudflare
# Worker that serves pyreconstruct.org/class/ behind a password. Setup, the two
# repository secrets and the Worker secrets: class/SETUP.md.

on:
  push:
    branches: [class]
    paths:
      - class/**
      - docs/stylesheets/extra.css
      - docs/javascripts/clips.js
      - docs/assets/images/logo.svg
      - docs/assets/images/favicon.png
      - docs/requirements.txt
      - .github/workflows/class-site.yml
  pull_request:
    branches: [class]
    paths:
      - class/**
      - docs/stylesheets/extra.css
      - docs/javascripts/clips.js
      - docs/assets/images/logo.svg
      - docs/assets/images/favicon.png
      - docs/requirements.txt
      - .github/workflows/class-site.yml
  workflow_dispatch:

# `build` runs the docs tooling and npm packages, so it holds no secrets and
# only reads the repository. The Cloudflare secrets reach `deploy` alone.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: docs/requirements.txt
      # Same MkDocs Material pin as the public site.
      - run: uv run --no-project --with-requirements ../docs/requirements.txt mkdocs build --strict
        working-directory: class
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: class/worker/package-lock.json
      - run: npm ci && npm test
        working-directory: class/worker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: class-site
          path: class/worker/public
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    # Only the class branch deploys; a manual run from any other ref builds only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/class'
    runs-on: ubuntu-latest
    # One deploy at a time; a queued one waits for the running one to finish.
    concurrency:
      group: class-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: class-site
          path: class/worker/public
      # No npm cache here: the job that holds the token installs fresh.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
        working-directory: class/worker
      # Deploys with the wrangler from package-lock.json. The passwords are
      # Worker secrets set once by hand, so this step never sees them.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: class/worker
          wranglerVersion: 4.152.0
