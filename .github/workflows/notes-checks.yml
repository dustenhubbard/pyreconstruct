name: notes

# Two report-only checks on what a pull request records about itself.
#
# `changelog-entry` reports a pull request that changes the application without
# recording it, either as a fragment under changelog.d/ or as a change to
# CHANGELOG.md. See scripts/check_changelog_entry.py for the rule, the two
# automatic exemptions, and the opt-out, and changelog.d/README.md for what an
# author writes.
#
# `changelog-entry` also reads each fragment the pull request adds or edits
# against the four mechanical voice rules of changelog.d/README.md (one bold
# claim and at most one sentence after it, no "Before," sentence, no "the
# app", one menu-path form). See scripts/check_fragment_voice.py.
#
# `docs-entry` reports a pull request that changes a menu, dialog, tool,
# shortcut, the updater or an installer without changing docs/ or README.md,
# and with no `No docs change: <reason>` line in the body. It also lists guide
# images that show a changed file, once docs/assets/images/user-guide/sources.json
# exists. See scripts/check_docs_entry.py for the path list and the rule.
#
# REPORT-ONLY. Both jobs always exit 0, the voice step included. A finding
# arrives as a warning annotation and a job summary, not as a failed check. To make either a gate,
# set BLOCKING = True in its script; nothing in this file needs to change. A
# gate also needs its job name added to the required checks in branch
# protection.
#
# No `branches:` filter, deliberately: a pull request changes the application
# exactly as much whatever branch it targets, so a base-branch filter here would
# only decide which changes go unrecorded. `test.yml` carried the filter this one
# was written to avoid and no longer does, so both workflows now run on every
# pull request.
#
# `edited` and the label types are in the trigger list because the opt-out lives
# in the pull request body. Without `edited`, adding the opt-out line would not
# re-run the check and the warning would stay on the pull request after it had
# been answered. The label types cost nothing and keep the same true if the
# opt-out ever moves to a label.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# One in-flight run per pull request; a newer push or edit supersedes the old.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Each check reads the changed-file list from git and the body
# from the event payload, and writes only a job summary.
permissions:
  contents: read

jobs:
  changelog-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 2 is enough for the diff below: the pull_request event
      # checks out the merge commit, whose first parent is the base. No project
      # environment is set up at all -- the check is stdlib-only Python, and the
      # runner image already has one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Collect the changed files
        run: git diff --name-only HEAD^1 HEAD > "${RUNNER_TEMP}/changed-files.txt"

      # Through a file and an environment variable, never interpolated into the
      # shell: a pull request body is attacker-controlled text.
      - name: Collect the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/pr-body.txt"

      - name: Changelog entry recorded
        run: |
          python3 scripts/check_changelog_entry.py \
            --changed-files "${RUNNER_TEMP}/changed-files.txt" \
            --body "${RUNNER_TEMP}/pr-body.txt"

      # Report-only, like the step above: the script exits 0 and annotates the
      # fragment's own line. Fragments the change deleted (an assemble) are
      # skipped, since there is nothing to read.
      - name: Fragment voice
        run: |
          python3 scripts/check_fragment_voice.py \
            --changed-files "${RUNNER_TEMP}/changed-files.txt"

  # The same shape as changelog-entry above, and the same care with the body.
  docs-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2

      - name: Collect the changed files
        run: git diff --name-only HEAD^1 HEAD > "${RUNNER_TEMP}/changed-files.txt"

      # Through a file and an environment variable, never interpolated into the
      # shell: a pull request body is attacker-controlled text.
      - name: Collect the pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/pr-body.txt"

      # The image map may not exist yet; the script skips the stale-shot list
      # and says so when it is missing.
      - name: Docs change recorded
        run: |
          python3 scripts/check_docs_entry.py \
            --changed-files "${RUNNER_TEMP}/changed-files.txt" \
            --body "${RUNNER_TEMP}/pr-body.txt" \
            --shot-sources docs/assets/images/user-guide/sources.json
