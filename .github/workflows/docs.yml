name: docs

# Build the MkDocs Material site and deploy it to the Cloudflare Worker that
# serves pyreconstruct.org (site-worker/). It moved off GitHub Pages on
# 2026-11-05: Cloudflare proxies the domain, so GitHub could not renew its
# certificate for it, and the site went down with Cloudflare error 526.
# Requires the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - packaging/linux/install-appimage.sh
      - packaging/linux/install.sh
      - mkdocs.yml
      - site-worker/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - packaging/linux/install-appimage.sh
      - packaging/linux/install.sh
      - mkdocs.yml
      - site-worker/**
      - .github/workflows/docs.yml
  workflow_dispatch:

# Least privilege. `build` runs on `pull_request` too, and its `mkdocs build`
# step installs and executes third-party code from docs/requirements.txt, so it
# holds no secrets and only reads the repository. The Cloudflare secrets reach
# `deploy` alone.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: docs/requirements.txt
      # --no-project: the docs build must not sync the app's own (heavy) env.
      - run: uv run --no-project --with-requirements docs/requirements.txt mkdocs build --strict
      # The Linux curl installers are served from the site so the commands stay
      # short: pyreconstruct.org/install.sh installs the AppImage, and
      # pyreconstruct.org/install-from-source.sh installs from source.
      - run: |
          cp packaging/linux/install-appimage.sh site/install.sh
          cp packaging/linux/install.sh site/install-from-source.sh
      # Skipped on `pull_request` only. A `workflow_dispatch` still builds and
      # uploads the artifact, because manual dispatch is the escape hatch for
      # redeploying the site without a docs change.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: site
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    # Only main deploys; a manual run from any other ref builds only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize deployments and let an in-progress one finish. The group is a
    # bare literal on purpose: every deployment targets the one site, so they
    # must share a lane whatever the ref. It sits on this job rather than the
    # workflow because a workflow-level group would also hold every
    # `pull_request` build, and a newly queued PR run cancels a *pending*
    # deploy (`cancel-in-progress: false` protects only an in-progress one).
    # A cancelled run is not a failed run, so the site would go stale with no
    # red check anywhere. Compare build-installers.yml, which records a real
    # outage from the same class of under-scoped group.
    concurrency:
      group: site
      cancel-in-progress: false
    environment:
      name: pyreconstruct.org
      url: https://pyreconstruct.org/
    steps:
      - name: Stop unless the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so nothing was deployed."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: site-worker
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: site
          path: site
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site-worker
          wranglerVersion: 4.152.0
