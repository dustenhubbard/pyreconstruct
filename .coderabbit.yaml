# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  commit_status: false
  high_level_summary: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!uv.lock"
    - "!**/*.jser"
  pre_merge_checks:
    docstrings:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    title:
      mode: warning
      requirements: "A Conventional Commit header, like 'fix: the scale bar keeps its width after Cancel'."
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

chat:
  art: false
  auto_reply: false

issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false
    auto_planning:
      enabled: false

knowledge_base:
  code_guidelines:
    filePatterns:
      - CONTRIBUTING.md
