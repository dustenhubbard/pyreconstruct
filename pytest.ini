# pytest configuration.
#
# addopts, flag by flag:
#
#   -q                quiet progress. Kept. A green run prints one summary line
#                     ("N passed in Xs"), which is the right default for a
#                     4,000-test suite.
#   -rs               print the reason for every SKIP. Deliberately -rs and not
#                     -ra: the suite has 6 xfails, one carrying a ~1,500
#                     character reason, and -ra would dump all of them into
#                     every default run. -rs adds nothing today (verified: the
#                     full run's output is byte-identical to plain -q, because
#                     nothing skips) and starts printing the moment something
#                     does. This is the gap that hid the pytest-qt problem: a
#                     bare `pytest` said "2 skipped" and no reason, so the two
#                     absent widget modules looked like housekeeping.
#                     `make test` and the CI job pass -ra explicitly, which
#                     overrides this; their output does not change.
#   --strict-markers  an unregistered marker is an error, not a silent no-op.
#                     `pytest.mark.gui2` on a module would otherwise collect and
#                     run as an ordinary unmarked test forever, and `-m gui`
#                     would never see it. Every marker the suite uses is
#                     registered in tests/conftest.py's pytest_configure.
#
# Related: tests/conftest.py turns a missing pytest-qt into a collection-time
# error for gui-marked tests rather than a skip.
[pytest]
testpaths = tests
addopts = -q -rs --strict-markers
